<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Query Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h3>Query Result</h3>

    {% if results %}
        <ul class="list-group mb-4">
            {% for row in results %}
                <li class="list-group-item">
                    <pre class="mb-0">{{ row }}</pre>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No results found.</p>
    {% endif %}

    <p>
        Go to
        <a href="{{ url_for('index') }}">Home Page</a> or
        <a href="{{ url_for('query_data') }}">Query Page</a>
    </p>

</body>
</html>
