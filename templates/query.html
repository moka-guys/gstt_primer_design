<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Query Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #d9e6f2);
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 650px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 { text-align: center; color: #2575fc; }

        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .filter-row div {
            flex: 1;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2575fc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .error {
            background: #ffe6e6;
            padding: 10px;
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Query Data</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        <h3>Genomic Filters</h3>

        <div class="filter-row">
            <div>
                <label>Chr</label>
                <input type="text" name="chr" placeholder="1-22, X, Y">
            </div>
            <div>
                <label>Gene</label>
                <input type="text" name="gene" placeholder="e.g. BRCA1">
            </div>
        </div>

        <div class="filter-row">
            <div>
                <label>Variant</label>
                <input type="text" name="variant" placeholder="">
            </div>
        </div>

        <div class="filter-row">
            <div>
                <label>Validation</label>
                <select name="passed_validation">
                    <option value="">Any</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
        </div>

        <div class="filter-row">
            <div>
                <label>Start Position</label>
                <input type="number" name="start">
            </div>
            <div>
                <label>End Position</label>
                <input type="number" name="end">
            </div>
        </div>

        <div class="filter-row">
            <div>
                <label>GRCh</label>
                <select name="grch">
                    <option value="37" selected>37</option>
                    <option value="38">38</option>
                </select>
            </div>
        </div>

        <h3>OR Upload JSON Filter</h3>
        <input type="file" name="file">

        <br><br>
        <button type="submit">Run Query</button>
    </form>

</div>
</body>
</html>
