<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
}

.container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    width: 420px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #555;
}

input[type=password] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
}

input[type=password]:focus {
    outline: none;
    border-color: #007BFF;
    box-shadow: 0 0 6px rgba(0,123,255,.3);
}

.btn {
    width: 100%;
    margin-top: 25px;
    padding: 12px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    background: #0056b3;
}

.message-error {
    margin-top: 20px;
    padding: 10px;
    background: #ffe5e5;
    color: #c00000;
    border-radius: 5px;
    text-align: center;
}

.message-success {
    margin-top: 20px;
    padding: 10px;
    background: #e7f8ea;
    color: #107c10;
    border-radius: 5px;
    text-align: center;
}

.footer {
    margin-top: 25px;
    text-align: center;
}

.footer a {
    color: #007BFF;
    text-decoration: none;
    font-weight: bold;
}

.footer a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Change Password</h2>

        <form method="POST">

            <label>Current Password</label>
            <input type="password" name="current_password" required>

            <label>New Password</label>
            <input type="password" name="new_password" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>

            <button class="btn" type="submit">
                Change Password
            </button>

            {% if error %}
            <div class="message-error">
                {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="message-success">
                {{ success }}
            </div>
            {% endif %}

        </form>

        <div class="footer">
            <a href="{{ url_for('logout') }}">Log Out</a>
        </div>

    </div>

</div>

</body>
</html>
