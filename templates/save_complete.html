<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-center p-5">

    <h2 class="text-success mb-4">
        Selected row(s) saved into Order sheet and inserted into Database ✅
    </h2>

    <p>
        <a href="{{ url_for('download', source='auto') }}"
           id="downloadBtn"
           class="btn btn-primary btn-lg">
            Download Order Sheet
        </a>
    </p>

    <br><br>

    <a href="{{ url_for('design_primer') }}"
       id="backBtn">
        Back to Design Page
    </a>

    <script>
        let hasDownloaded = false;

        // Mark as downloaded when user clicks Download
        document.getElementById("downloadBtn").addEventListener("click", function () {
            hasDownloaded = true;
        });

        // Ask only if the user has NOT downloaded
        document.getElementById("backBtn").addEventListener("click", function (event) {

            if (!hasDownloaded) {
                const confirmLeave = confirm(
                    "You have not downloaded the Order Sheet. Are you sure you want to go back?"
                );

                if (!confirmLeave) {
                    event.preventDefault();
                }
            }

        });
    </script>

</body>
</html>
