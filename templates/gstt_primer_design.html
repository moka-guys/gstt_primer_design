<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        /* Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        /* Form container */
        form {
            background: #ffffff;
            max-width: 350px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        form:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 35px rgba(0,0,0,0.35);
        }

        h2 {
            margin-bottom: 25px;
            color: #6a11cb;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 8px rgba(106,17,203,0.6) inset;
            outline: none;
        }

        /* Button */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Error message */
        .error {
            color: #ff4d4f;
            font-weight: bold;
            margin-bottom: 15px;
            background: #ffe6e6;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <form method="POST" action="{{ url_for('gstt_primer_design') }}">
        <h2>Welcome to PRADA (PRimer and Amplicon Design Application)</h2>
        <h3 style="color: red;">This is Test Server. Do not use for Production/Clinical Service</h3>

        <!-- Show error if provided by Flask -->
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <input type="text" id="user" name="user" placeholder="Username" required>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
</body>
</html>
