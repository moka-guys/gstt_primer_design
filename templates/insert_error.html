<!DOCTYPE html>
<html>
<head>

        body { font-family: Arial; text-align: center; padding: 50px; }
        .box {
            display: inline-block;
            padding: 30px;
            background: #ffe6e6;
            border-radius: 10px;
        }
        a {
            margin-top: 20px;

            padding: 10px 20px;

</html>
